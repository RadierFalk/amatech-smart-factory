name: Imagens do ERP (API e web)

# Constrói as imagens do ERP novo (backend/Dockerfile e frontend/Dockerfile).
# - Pull request: só constrói (confere que os Dockerfiles funcionam), não publica.
# - Push na main, tag v* ou execução manual: publica no GHCR como
#     ghcr.io/<dono>/<repositório>-api  e  ghcr.io/<dono>/<repositório>-web
#   com as tags latest (só na main), o SHA do commit e a versão da tag.
# A imagem antiga (Streamlit, Dockerfile da raiz) continua em docker-publish.yml até a virada.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["backend/**", "frontend/**", ".github/workflows/erp-imagens.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/erp-imagens.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: api
            contexto: backend
          - nome: web
            contexto: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.nome }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=ref,event=pr

      - name: Construir${{ github.event_name != 'pull_request' && ' e publicar' || '' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.contexto }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
