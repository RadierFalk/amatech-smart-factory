name: Testes do backend (PostgreSQL)

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-testes.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-testes.yml"]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amatech
          POSTGRES_PASSWORD: amatech
          POSTGRES_DB: amatech_testes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amatech -d amatech_testes"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      AMATECH_DATABASE_URL: postgresql+psycopg://amatech:amatech@localhost:5432/amatech_testes
      AMATECH_TEST_DATABASE_URL: postgresql+psycopg://amatech:amatech@localhost:5432/amatech_testes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Migrações do zero até head
        run: alembic upgrade head

      - name: Modelos e migrações em sincronia
        run: alembic check

      - name: Testes (falha se algum for pulado por falta de banco)
        run: |
          python -m pytest -q -rs | tee saida.txt
          if grep -q "skipped" saida.txt; then echo "::error::Testes pulados: o Postgres não foi alcançado"; exit 1; fi
