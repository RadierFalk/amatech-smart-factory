name: Testes do frontend (Angular)

on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend-testes.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-testes.yml"]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
