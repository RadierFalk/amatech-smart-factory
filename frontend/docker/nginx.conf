# nginx do frontend do ERP AMATECH.
#   /api/...  -> serviço "erp-api" da stack (porta 8000), com os cabeçalhos do proxy
#   /saude    -> verificação do próprio nginx (healthcheck)
#   o resto   -> arquivos do Angular; rota desconhecida volta para index.html (o roteador do Angular resolve)
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Importação de planilhas do Dashboard (CSV no corpo da requisição).
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS interno do Docker: o nome "erp-api" é resolvido a cada requisição, então o nginx sobe mesmo se a API
    # ainda não estiver no ar (e acompanha a troca de contêiner numa atualização).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://erp-api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location = /saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html nunca em cache: uma versão nova aparece no próximo carregamento.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Arquivos com hash no nome (outputHashing: all): podem ficar em cache por um ano.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
